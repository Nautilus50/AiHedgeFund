name: arf-os-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arf
      POSTGRES_PASSWORD: arf
      POSTGRES_DB: arf_os
    ports:
      - "5432:5432"
    volumes:
      - arf_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arf -d arf_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arf_os_postgres_data:
